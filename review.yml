sources:
  - url: https://api.tyntec.com/reference/
    type: Documentation
    note: Product index; all APIs are REST under https://api.tyntec.com with an apikey header. No WebSocket mentioned.
  - url: https://api.tyntec.com/reference/verify/current.html
    type: APIReference
    note: Verify API - GET /verify/v1/phone/{number} plus template CRUD; also references NIS GNV (HLR) and GNP (portability).
  - url: https://api.tyntec.com/reference/sms/current.html
    type: APIReference
    note: SMS API under /messaging/v1; inbound via webhook. All REST.
  - url: https://api.tyntec.com/reference/conversations/current.html
    type: APIReference
    note: Conversations API under /conversations/v3 (WhatsApp/Viber/SMS); status and inbound via webhooks, not WebSocket.
  - url: https://api.tyntec.com/reference/otp-authentication/current.html
    type: APIReference
    note: 2FA/OTP API under /2fa/v4. All REST.
  - url: https://github.com/tyntec/api-collection
    type: SourceCode
    note: Public OpenAPI definitions for all tyntec products; no WebSocket/AsyncAPI surface published.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. tyntec's public API is
    request/response REST across all products, with asynchronous events
    delivered by outbound HTTP webhook callbacks to customer-configured URLs. No
    AsyncAPI document was created because there is no server-push transport
    (WebSocket or SSE) on tyntec's own API to model; webhook callbacks are
    server-to-endpoint HTTP and are documented as such.
