    - GET    https://api.tyntec.com/nis/v1/gnp
    - POST   https://api.tyntec.com/2fa/v4/otp
    - GET    https://api.tyntec.com/2fa/v4/otp
    - GET    https://api.tyntec.com/2fa/v4/otp/{otp-id}
    - POST   https://api.tyntec.com/2fa/v4/otp/{otp-id}/validate
    - DELETE https://api.tyntec.com/2fa/v4/otp/{otp-id}
    - POST   https://api.tyntec.com/messaging/v1/sms
    - GET    https://api.tyntec.com/messaging/v1/sms
    - GET    https://api.tyntec.com/messaging/v1/messages/{requestId}
    - POST   https://api.tyntec.com/messaging/v1/conversion
    - POST   https://api.tyntec.com/conversations/v3/messages
