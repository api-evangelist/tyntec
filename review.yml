aid: tyntec
name: tyntec
review:
  question: Does tyntec expose a documented public WebSocket API?
  answer: false
  date: '2026-07-11'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. tyntec's public API surface
    (api.tyntec.com) is request/response REST over HTTPS across every product -
    Verify / Number Information, SMS, Conversations (WhatsApp / Viber / SMS), and
    2FA. Asynchronous delivery notifications, inbound messages, and status
    updates are delivered as server-to-endpoint HTTP webhook callbacks (HTTP
    POST to a URL you configure), not over a WebSocket or SSE stream on tyntec's
    own API. There is no server-push transport on tyntec's public API to model.
findings:
  summary: |
    tyntec does not publish a documented public WebSocket API. tyntec is a CPaaS
    provider whose APIs live under https://api.tyntec.com and authenticate with
    an account API key in the `apikey` request header. All documented endpoints
    are HTTPS REST. Asynchronous events - SMS delivery receipts, inbound
    messages, WhatsApp/Viber message status - are delivered via HTTP webhook
    callbacks to URLs the customer configures, i.e. server-to-endpoint HTTP
    POST, not a client-held WebSocket (ws:// / wss://) connection. No realtime,
    bidirectional, or streaming WebSocket endpoint is documented on any tyntec
    product page or in the tyntec/api-collection OpenAPI specs as of the review
    date.
  publicApi: |
    Yes - tyntec has a real, publicly documented API program. The reference is at
    api.tyntec.com/reference and OpenAPI definitions are published openly in the
    tyntec/api-collection GitHub repository (folders: verify, sms, conversations,
    otp-authentication, silent-authentication, network-signals, voice, account).
    Getting an API key requires a tyntec account; the docs and specs are public.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.tyntec.com
      documented: true
      note: All products (Verify, Number Information/NIS, SMS, Conversations, 2FA) are REST over HTTPS with an apikey header.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Inbound messages and delivery/status callbacks are POSTed to a customer-configured URL. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in any tyntec API reference or in the tyntec/api-collection specs as of the review date.
  endpointsConfirmedRest:
    - GET    https://api.tyntec.com/verify/v1/phone/{number}
    - GET    https://api.tyntec.com/verify/v1/templates
    - POST   https://api.tyntec.com/verify/v1/templates
