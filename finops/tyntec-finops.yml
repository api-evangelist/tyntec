description: >-
  FinOps view of tyntec spend. tyntec is a usage-billed CPaaS: cost is driven by
  the volume of transactions across each product - SMS messages sent/received,
  WhatsApp conversations (priced by category and country), number verification and
  HLR lookups, and 2FA OTPs dispatched. Charges are deducted from a prepaid
  account balance, with negotiated committed-volume agreements for enterprise
  usage. The dominant cost drivers are messaging volume and destination mix, since
  per-message and per-conversation rates vary widely by country and carrier.
notes: >-
  Per-unit rates are destination-dependent and, for verification / HLR lookups,
  quoted on request; they are not fully reconciled here. Track spend per product
  and per destination country. WhatsApp conversation charges pass through Meta's
  category-based rate plus tyntec's fee.
