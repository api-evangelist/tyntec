meters:
- name: sms_messages
  description: SMS messages sent and received over the A2P network, billed per message by destination.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - destination_country
  - direction
- name: whatsapp_conversations
  description: WhatsApp conversations, billed per conversation by category (marketing, utility, authentication, service) and country.
  unit: conversations
  aggregation: sum
  dimensions:
  - account
  - destination_country
  - conversation_category
- name: number_lookups
  description: Number verification and HLR / portability lookups, billed per transaction.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - lookup_type
- name: otp_dispatched
  description: 2FA one-time passwords dispatched, billed per OTP by channel and destination.
  unit: otp
  aggregation: sum
  dimensions:
  - account
  - channel
  - destination_country
principles:
- name: Visibility
  description: Track transaction volume per product and per destination country; messaging cost is dominated by destination mix.
- name: Allocation
  description: Separate accounts or sender IDs per team/campaign so messaging and verification spend maps to cost centers.
- name: Optimization
  description: Verify numbers before messaging to avoid wasted sends to invalid/unreachable numbers; choose the right WhatsApp conversation category; consolidate volume for committed-use discounts.
- name: Accountability
  description: Assign owners per product line; review prepaid balance burn and monthly transaction volume against budget.
