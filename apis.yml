    type: APIReference
  - url: https://github.com/tyntec/api-collection/tree/master/conversations
    type: SourceCode
  description: >-
    One API for WhatsApp Business, Viber, and SMS. Send single (POST /messages) or bulk (POST /bulks)
    messages, track delivery status and events, upload and manage media, configure WhatsApp accounts /
    templates / phone-number insights, and receive inbound messages and status callbacks via webhooks.
    tyntec is an authorized WhatsApp Business Solution Provider.
