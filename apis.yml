apis:
- aid: tyntec:tyntec-2fa-authentication-api
  name: tyntec 2FA Authentication API
  tags:
  - Two-Factor Authentication
  - OTP
  - Number Verification
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.tyntec.com/reference/otp-authentication/current.html
  baseURL: https://api.tyntec.com/2fa/v4
  properties:
  - url: https://www.tyntec.com/helpcenter/docs/
    type: Documentation
  - url: https://api.tyntec.com/reference/otp-authentication/current.html
    type: APIReference
  - url: https://github.com/tyntec/api-collection/tree/master/otp-authentication
    type: SourceCode
  description: >-
    Programmatic two-factor authentication and one-time passwords. Send an OTP to a recipient number (POST
    /otp), validate the code the user enters (POST /otp/{otp-id}/validate returning VERIFIED, EXPIRED,
    WRONG_CODE, or TOO_MANY_ATTEMPTS), and read, list, or delete OTP records.
- aid: tyntec:tyntec-sms-api
  name: tyntec SMS API
  tags:
  - SMS
  - Messaging
  - A2P
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.tyntec.com/reference/sms/current.html
  baseURL: https://api.tyntec.com/messaging/v1
  properties:
  - url: https://www.tyntec.com/helpcenter/docs/
    type: Documentation
  - url: https://api.tyntec.com/reference/sms/current.html
    type: APIReference
  - url: https://github.com/tyntec/api-collection/tree/master/sms
    type: SourceCode
  description: >-
    Send and receive text messages over tyntec's global A2P SMS network. Send via POST /messaging/v1/sms,
    retrieve delivery status via GET /messaging/v1/messages/{requestId}, receive inbound SMS by webhook,
    and report delivery conversion events. Includes BYON (bring your own number) contact, phone book,
    and number provisioning services.
- aid: tyntec:tyntec-conversations-api
  name: tyntec Conversations API
  tags:
  - WhatsApp
  - Messaging
  - Chat Apps
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.tyntec.com/reference/conversations/current.html
  baseURL: https://api.tyntec.com/conversations/v3
  properties:
